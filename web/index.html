<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat Manager — Canvas</title>
<style>
/* ============================================================
   THEME TOKENS — every color in this file comes from here.
   Dark is the default; [data-theme="light"] is a full override,
   not an inversion.
   ============================================================ */
:root {
  /* surfaces */
  --bg:            #0F1211;
  --panel:         #151918;
  --panel-2:       #1B2120;
  --panel-3:       #222927;
  --rail:          #121615;
  --line:          #262D2C;
  --line-soft:     #1E2423;
  --line-strong:   #35403E;

  /* text */
  --text:          #E9EBE7;
  --text-dim:      #BFC5C1;
  --muted:         #98A29E;
  --faint:         #6E7875;

  /* accent — single teal-green */
  --accent:        #3FA79A;
  --accent-deep:   #2F8B80;
  --accent-bright: #55BCAF;
  --accent-soft:   #12302C;
  --accent-line:   #2A5F59;
  --accent-on:     #06120F;
  --ring-focus:    rgba(63,167,154,.30);

  /* status — AA against --panel-2 / --panel */
  --todo:          #98A29E;
  --prog:          #63A6E8;
  --done:          #56AE72;
  --block:         #E0796A;
  --cancel:        #6C7673;

  /* status chips — fill + ink pairs */
  --todo-fill:     #232A29;   --todo-ink:   #AEB7B3;
  --prog-fill:     #14283C;   --prog-ink:   #8CC1F2;
  --done-fill:     #16301F;   --done-ink:   #7FC895;
  --block-fill:    #3A1D18;   --block-ink:  #F0A093;
  --cancel-fill:   #212726;   --cancel-ink: #8B9491;
  --neutral-fill:  #232A29;   --neutral-ink:#9BA5A1;

  /* canvas */
  --grid-dot:      #232B2A;
  --edge:          #35403E;
  --edge-active:   var(--accent-line);

  /* input */
  --field:         #0B0E0D;
  --field-line:    #2A3231;

  /* effects */
  --shadow-sm:     0 1px 2px rgba(0,0,0,.34);
  --shadow-md:     0 6px 20px rgba(0,0,0,.42);
  --shadow-lg:     0 18px 48px rgba(0,0,0,.55);
  --scrim:         rgba(6,9,8,.72);
  --pulse:         rgba(99,166,232,.16);

  /* metrics */
  --lw: 268px;
  --rw: 328px;
  --rail-w: 56px;
}

[data-theme="light"] {
  --bg:            #EFEEE9;
  --panel:         #FBFBF9;
  --panel-2:       #F5F4F0;
  --panel-3:       #EDECE6;
  --rail:          #F7F6F3;
  --line:          #E4E3DC;
  --line-soft:     #EDECE6;
  --line-strong:   #C9C8C0;

  --text:          #111113;
  --text-dim:      #35363A;
  --muted:         #6E6E73;
  --faint:         #8C8C90;

  --accent:        #1A5E5A;
  --accent-deep:   #124742;
  --accent-bright: #227870;
  --accent-soft:   #E4EEEC;
  --accent-line:   #A8CBC6;
  --accent-on:     #FFFFFF;
  --ring-focus:    rgba(26,94,90,.22);

  --todo:          #6A6F73;
  --prog:          #1B5FA8;
  --done:          #256B44;
  --block:         #A83A26;
  --cancel:        #86898D;

  --todo-fill:     #ECEBE5;   --todo-ink:   #5C6165;
  --prog-fill:     #E3EDF8;   --prog-ink:   #17538F;
  --done-fill:     #E2EFE6;   --done-ink:   #1E5B3A;
  --block-fill:    #F8E6E1;   --block-ink:  #8E2F1E;
  --cancel-fill:   #ECEBE5;   --cancel-ink: #6E7276;
  --neutral-fill:  #ECEBE5;   --neutral-ink:#5C6165;

  --grid-dot:      #DCDBD3;
  --edge:          #CBCAC2;
  --edge-active:   #9BC3BD;

  --field:         #FFFFFF;
  --field-line:    #DCDBD3;

  --shadow-sm:     0 1px 2px rgba(28,26,20,.06);
  --shadow-md:     0 6px 18px rgba(28,26,20,.10);
  --shadow-lg:     0 18px 44px rgba(28,26,20,.16);
  --scrim:         rgba(240,239,234,.78);
  --pulse:         rgba(27,95,168,.14);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#root { height: 100%; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none;
        stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }

/* ============================================================
   SHELL
   ============================================================ */
.app { display: grid; grid-template-rows: 52px 1fr; height: 100%; }

.top {
  display: flex; align-items: center; gap: 18px; padding: 0 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 650; letter-spacing: -0.012em; font-size: 14px; }
.brand span { color: var(--accent); }
.stats { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12.5px; }
.stats > span {
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 3px 9px; border-radius: 6px;
}
.stats > span:hover { background: var(--panel-2); }
.stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats .sq { width: 6px; height: 6px; border-radius: 2px; align-self: center; }
.spacer { flex: 1; }
.crumb {
  display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted);
  padding-right: 4px; border-right: 1px solid var(--line); padding-left: 2px;
}
.crumb b { color: var(--text-dim); font-weight: 550; }
.live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted);
        letter-spacing: .02em; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
.dot.off { background: var(--faint); }
.dot.live { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

button {
  font: inherit; color: var(--text-dim); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .14s, border-color .14s, color .14s, transform .1s;
}
button:hover { border-color: var(--line-strong); color: var(--text); }
button:active { transform: translateY(.5px); }
button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring-focus); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); font-weight: 550; }
button.primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: var(--accent-on); }
button.ghost { background: transparent; }
button.ghost:hover { background: var(--panel-2); }
button.icon { padding: 5px; width: 28px; height: 28px; justify-content: center; }
button[disabled] { opacity: .5; cursor: default; }

input {
  font: inherit; color: var(--text); background: var(--field);
  border: 1px solid var(--field-line); border-radius: 8px; padding: 9px 11px; width: 100%;
}
input::placeholder { color: var(--faint); }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring-focus); }

.body {
  display: grid; grid-template-columns: var(--lw) 1fr var(--rw); min-height: 0;
  transition: grid-template-columns .22s cubic-bezier(.2,.7,.3,1);
}
.body[data-left="off"]  { --lw: var(--rail-w); }
.body[data-right="off"] { --rw: var(--rail-w); }

/* shared panel furniture ------------------------------------ */
.left, .side {
  background: var(--panel); overflow: hidden auto; min-width: 0;
  display: flex; flex-direction: column;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.left { border-right: 1px solid var(--line); }
.side { border-left: 1px solid var(--line); }
.left h3, .side h3 {
  display: flex; align-items: center; gap: 8px; margin: 0;
  padding: 16px 14px 8px; font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--faint); font-weight: 600;
}
.left h3 .spacer, .side h3 .spacer { flex: 1; }
.left h3 .n, .side h3 .n {
  font-size: 10.5px; letter-spacing: .04em; color: var(--faint);
  background: var(--neutral-fill); border-radius: 20px; padding: 1px 7px;
  font-variant-numeric: tabular-nums;
}
.panel-head {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 14px;
  border-bottom: 1px solid var(--line-soft); flex: none;
}
.panel-head .lbl { font-size: 12.5px; font-weight: 600; letter-spacing: -.005em; flex: 1;
                   white-space: nowrap; overflow: hidden; }
.collapse { background: transparent; border-color: transparent; color: var(--faint); padding: 5px;
            width: 26px; height: 26px; justify-content: center; }
.collapse:hover { background: var(--panel-2); color: var(--text); }
.sep { height: 1px; background: var(--line-soft); margin: 10px 14px; flex: none; }

/* ============================================================
   LEFT — projects, chats, recovery
   ============================================================ */
.newbtn { font-size: 11.5px; padding: 3px 9px; border-radius: 6px; }
.plist { padding: 2px 8px 4px; display: flex; flex-direction: column; gap: 2px; }
.prow {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
  cursor: pointer; border: 1px solid transparent; position: relative;
  transition: background .14s, border-color .14s;
}
.prow:hover { background: var(--panel-2); }
.prow.on { background: var(--panel-2); border-color: var(--line); }
.prow.on::before {
  content: ""; position: absolute; left: -1px; top: 50%; transform: translateY(-50%);
  width: 2px; height: 22px; border-radius: 2px; background: var(--accent);
}
.prow .av {
  width: 26px; height: 26px; border-radius: 8px; flex: none;
  display: grid; place-items: center; font-size: 11px; font-weight: 600;
  background: var(--panel-3); color: var(--muted); border: 1px solid var(--line);
}
.prow.on .av { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.prow .nm { flex: 1; min-width: 0; }
.prow .nm > .t {
  font-size: 13px; font-weight: 550; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.prow.on .nm > .t { color: var(--text); }
.prow .ct { font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 5px;
            margin-top: 1px; font-variant-numeric: tabular-nums; }
.prow .ct i { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }
.copy {
  opacity: 0; border: 1px solid transparent; background: transparent; color: var(--faint);
  padding: 4px; width: 24px; height: 24px; border-radius: 6px; justify-content: center;
}
.prow:hover .copy, .prow .copy:focus-visible { opacity: 1; }
.copy:hover { color: var(--text); background: var(--panel-3); }
.copy.done { opacity: 1; color: var(--accent); }

.chats { padding: 0 14px 6px; display: flex; flex-direction: column; gap: 1px; }
.chats > div {
  display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 12.5px;
  color: var(--muted);
}
.chats > div + div { border-top: 1px solid var(--line-soft); }
.chats .cdot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.chats .nm { flex: 1; color: var(--text-dim); }
.chats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.chats .ref { font-size: 11px; color: var(--faint); }

.note {
  margin: 4px 14px 0; padding: 10px 11px; border-radius: 9px;
  background: var(--panel-2); border: 1px solid var(--line-soft);
  font-size: 11.5px; line-height: 1.5; color: var(--muted);
}
.note b { color: var(--text-dim); font-weight: 600; }
.recovery {
  margin: 2px 14px 16px; padding: 12px; border-radius: 10px;
  background: var(--accent-soft); border: 1px solid var(--accent-line);
}
.recovery p { margin: 0 0 10px; font-size: 11.5px; line-height: 1.5; color: var(--text-dim); }
.recovery pre {
  margin: 0 0 10px; padding: 9px 10px; max-height: 74px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--faint); white-space: pre-wrap;
  mask-image: linear-gradient(#000 46%, transparent 100%);
  -webkit-mask-image: linear-gradient(#000 46%, transparent 100%);
}
.recovery button { width: 100%; justify-content: center; }
.recovery button.done { color: var(--accent); border-color: var(--accent-line); }

/* rails (collapsed panels) ---------------------------------- */
.rail {
  display: none; background: var(--rail); overflow: hidden;
  flex-direction: column; align-items: center; gap: 6px; padding: 9px 0;
}
.body[data-left="off"] .left > :not(.rail),
.body[data-right="off"] .side > :not(.rail) { display: none; }
.body[data-left="off"] .left .rail,
.body[data-right="off"] .side .rail { display: flex; }
.rail .rbtn {
  width: 34px; height: 34px; padding: 0; justify-content: center; background: transparent;
  border-color: transparent; color: var(--faint); position: relative; border-radius: 9px;
}
.rail .rbtn:hover { background: var(--panel-2); color: var(--text); }
.rail .rbtn.on { background: var(--accent-soft); color: var(--accent); }
.rail .rbtn .badge {
  position: absolute; right: 1px; bottom: 1px; font-size: 9px; line-height: 1;
  padding: 1px 3px; border-radius: 5px; background: var(--panel-3); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.rail .rdiv { width: 20px; height: 1px; background: var(--line); margin: 3px 0; flex: none; }
.rail .rlabel {
  writing-mode: vertical-rl; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--faint); margin-top: 4px;
}

/* ============================================================
   CANVAS
   ============================================================ */
.stage {
  position: relative; overflow: hidden; cursor: grab; min-width: 0;
  background:
    radial-gradient(circle at 1px 1px, var(--grid-dot) 1px, transparent 0) 0 0 / 26px 26px,
    var(--bg);
}
.stage.drag { cursor: grabbing; }
.world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

.node {
  position: absolute; width: 250px; padding: 11px 13px 11px 14px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-left: 2px solid var(--todo);
  border-radius: 10px; cursor: pointer; box-shadow: var(--shadow-sm);
  transition: transform .35s cubic-bezier(.2,.7,.3,1), top .35s cubic-bezier(.2,.7,.3,1),
              left .35s cubic-bezier(.2,.7,.3,1), border-color .18s, box-shadow .18s,
              background .18s;
}
.node:hover { border-color: var(--line-strong); box-shadow: var(--shadow-md); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring-focus), var(--shadow-md); }
.node.s-in_progress { border-left-color: var(--prog); }
.node.s-done       { border-left-color: var(--done); }
.node.s-blocked    { border-left-color: var(--block); }
.node.s-cancelled  { border-left-color: var(--cancel); opacity: .5; }
.node.ghost { border-style: dashed; opacity: .62; }
.node.s-in_progress { animation: glow 2.6s ease-in-out infinite; }
@keyframes glow {
  0%,100% { box-shadow: var(--shadow-sm) }
  50%     { box-shadow: 0 0 0 4px var(--pulse), var(--shadow-sm) }
}
.node.fresh { animation: pop .5s cubic-bezier(.2,1,.4,1); }
@keyframes pop { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }

.n-title { font-weight: 550; font-size: 13px; line-height: 19px; color: var(--text); }
.node.s-done .n-title { color: var(--muted); text-decoration: line-through;
                        text-decoration-color: var(--edge); }
.node.s-cancelled .n-title { text-decoration: line-through; text-decoration-color: var(--edge); }
.n-meta { display: flex; align-items: center; gap: 7px; margin-top: 8px; height: 17px;
          font-size: 11px; color: var(--faint); }
.chip {
  padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  background: var(--neutral-fill); color: var(--neutral-ink);
}
.chip.s-todo        { background: var(--todo-fill);   color: var(--todo-ink); }
.chip.s-in_progress { background: var(--prog-fill);   color: var(--prog-ink); }
.chip.s-done        { background: var(--done-fill);   color: var(--done-ink); }
.chip.s-blocked     { background: var(--block-fill);  color: var(--block-ink); }
.chip.s-cancelled   { background: var(--cancel-fill); color: var(--cancel-ink); }
.src { width: 7px; height: 7px; border-radius: 2px; background: var(--edge); margin-left: auto; }

.zoom {
  position: absolute; right: 16px; bottom: 16px; display: flex; gap: 5px; padding: 5px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow-md);
}
.zoom button { width: 30px; height: 28px; padding: 0; justify-content: center;
               background: transparent; border-color: transparent; color: var(--muted); }
.zoom button:hover { background: var(--panel-2); color: var(--text); }
.zoom .lvl { min-width: 40px; display: grid; place-items: center; font-size: 11.5px;
             color: var(--faint); font-variant-numeric: tabular-nums; }

.legend {
  position: absolute; left: 16px; bottom: 16px; display: flex; gap: 12px;
  padding: 7px 11px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow-sm); font-size: 11px; color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 2px; }

.hintbar {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 6px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  font-size: 11.5px; color: var(--faint); box-shadow: var(--shadow-sm);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.hintbar.show { opacity: 1; }
.hintbar kbd {
  font: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 5px;
  background: var(--panel-3); border: 1px solid var(--line); color: var(--muted);
}

/* ============================================================
   RIGHT — evidence + feed
   ============================================================ */
.ev { padding: 4px 14px 14px; }
.ev .ti { font-size: 14px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em;
          color: var(--text); }
.ev .q {
  color: var(--text-dim); font-size: 12.5px; line-height: 1.6; margin: 12px 0 0;
  padding: 11px 12px 11px 13px; background: var(--panel-2); border: 1px solid var(--line-soft);
  border-left: 2px solid var(--accent); border-radius: 0 9px 9px 0;
}
.ev .qsrc { display: flex; align-items: center; gap: 7px; margin-top: 9px;
            font-size: 11px; color: var(--faint); }
.ev .qsrc .cdot { width: 8px; height: 8px; border-radius: 3px; flex: none; }

.feed { padding: 0 14px 18px; display: flex; flex-direction: column; }
.feed > div {
  display: grid; grid-template-columns: 14px 1fr; gap: 10px;
  padding: 9px 0; font-size: 12.5px; color: var(--muted);
  border-bottom: 1px solid var(--line-soft); position: relative;
}
.feed > div:last-child { border-bottom: none; }
.feed .mk {
  width: 7px; height: 7px; border-radius: 50%; background: var(--edge);
  margin: 5px 0 0 3px; position: relative;
}
.feed > div:not(:last-child) .mk::after {
  content: ""; position: absolute; left: 50%; top: 11px; bottom: -22px;
  width: 1px; background: var(--line); transform: translateX(-50%);
}
.feed b { color: var(--text); font-weight: 550; }
.feed .op { color: var(--muted); }
.feed .t { font-size: 11px; color: var(--faint); margin-top: 3px;
           font-variant-numeric: tabular-nums; }

/* skeleton / empty ------------------------------------------ */
.empty {
  color: var(--muted); text-align: center; padding: 34px 22px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty .ico { color: var(--faint); }
.empty .h { font-size: 13px; font-weight: 600; color: var(--text-dim); }
.empty .p { font-size: 12px; line-height: 1.55; color: var(--faint); max-width: 220px; }
.skel { padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 9px; }
.skel i { display: block; height: 10px; border-radius: 5px; background: var(--panel-3);
          animation: sheen 1.5s ease-in-out infinite; }
@keyframes sheen { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 8px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 15px; font-size: 12.5px; color: var(--text-dim); z-index: 50;
  box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 9px;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .ok { color: var(--accent); }

/* ============================================================
   LOGIN
   ============================================================ */
.gate {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 80;
  background: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, var(--grid-dot) 1px, transparent 0);
  background-size: 26px 26px;
}
.gate[hidden] { display: none; }
.card {
  width: 392px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 30px 28px 24px; box-shadow: var(--shadow-lg);
}
.card .mark { display: flex; align-items: center; gap: 9px; margin-bottom: 20px; color: var(--accent); }
.card h1 { margin: 0 0 5px; font-size: 20px; letter-spacing: -.02em; font-weight: 650; }
.card h1 span { color: var(--accent); }
.card p { margin: 0 0 20px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.card label { display: block; font-size: 11.5px; color: var(--muted); margin: 14px 0 6px;
              font-weight: 550; }
.card .row { display: flex; gap: 8px; margin-top: 22px; }
.card .row button { justify-content: center; padding: 9px 14px; }
.card .row button.primary { flex: 1; }
.err { color: var(--block); font-size: 12px; margin-top: 12px; display: flex; gap: 7px;
       align-items: flex-start; }
.hint { color: var(--faint); font-size: 11.5px; line-height: 1.55; }
.card .hint { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.card .hint b { color: var(--muted); font-weight: 600; }
.devlink {
  position: fixed; right: 12px; bottom: 10px; z-index: 90;
  font-size: 10.5px; color: var(--faint); background: var(--panel);
  border: 1px dashed var(--line-strong); border-radius: 6px; padding: 3px 8px; cursor: pointer;
}
.devlink:hover { color: var(--text); }

  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches

  }
  document.documentElement.setAttribute("data-theme", t);
})();
